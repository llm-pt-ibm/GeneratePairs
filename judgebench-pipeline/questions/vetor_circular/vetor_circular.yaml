text: |

    # Imprimir vetor circular

    Escreva um programa que imprime um vetor de maneira circular. 
    Seu programa deve receber uma sequência de valores e um inteiro N e deve imprimir as N posições da sequência lida. 
    Naturalmente, N pode ser maior do que o tamanho da sequência lida. 

    Nesses casos, você deve reiniciar a impressão partindo novamente do início do vetor.

    ## Entrada

    Seu programa receberá na primeira linha uma sequência de valores separados por espaço e, na segunda linha, 
    um valor N que dirá quantos elementos devem ser impressos.

    ## Saída

    Seu programa deve imprimir a sequencia de número com N elementos de forma circular. 
    Ou seja, quando o último elemento for impresso ele deve voltar para o primeiro e 
    continuar até chegar a N elementos impressos.

    ## Exemplos de execução

        javac Solucao.java; java Solucao
        4 5 6 1
        6
        4 5 6 1 4 5

        javacSolucao.java; java Solucao
        3 4 2
        8
        3 4 2 3 4 2 3 4
tests:
-   category: public
    input: |
        4 5 6 1
        6
    output: |
        4 5 6 1 4 5
-   category: public
    input: |
        3 4 2
        8
    output: |
        3 4 2 3 4 2 3 4
-   input: |
        1
        4
    output: |
        1 1 1 1
-   input: |
        3 5 6 8 1 2
        3
    output: |
        3 5 6
-   input: |
        9 4 5 6 5
        10
    output: |
        9 4 5 6 5 9 4 5 6 5
