name: fura_fila_um_a_um
label: Fura fila
tags: [fila, arrays]
text: |

    # Fura fila
    
    Suponha que um array representa uma fila para entrada em um show. Contudo, 
    o pessoal da terceira idade (**todas as pessoas a partir do índice i**), resolveu
    exercer o seu direito de ter prioridade na entrada. Assim, você deve deslocar (um a um)
    os idosos para o início da fila, respeitando, naturalmente a ordem entre os idosos.

    ## Entrada

    Seu programa deve ler 2 linhas. A primeira contém uma sequência (representando a fila) de 
    inteiros separados por espaço.
    
    A segunda contém um índice válido **i** da sequência. Esse índice marca o início dos idosos na fila.

    ## Saída

    Seu programa deve imprimir o array depois de fazer cada elemento a partir da posição i ocupar o 
    seu lugar no início da fila.

    Para cada operação de fura-fila feita, você deve imprimir o estado atual do array. Veja os exemplos de entrada e saída para
    um melhor entendimento.

    Considere que o índice passado é válido.


    ## Restrições

    Não é permitido utilizar outro array diferente do utilizado para armazenar 
    a sequência inicial.


    ## Exemplos de execução

        javac MinhaSolucao.java; java MinhaSolucao
        0 1 2 3 4 5 6 7 8
        4
        [4, 0, 1, 2, 3, 5, 6, 7, 8]
        [4, 5, 0, 1, 2, 3, 6, 7, 8]
        [4, 5, 6, 0, 1, 2, 3, 7, 8]
        [4, 5, 6, 7, 0, 1, 2, 3, 8]
        [4, 5, 6, 7, 8, 0, 1, 2, 3]
        
        javac MinhaSolucao.java; java MinhaSolucao
        5 1 7 3 9 10
        2
        [7, 5, 1, 3, 9, 10]
        [7, 3, 5, 1, 9, 10]
        [7, 3, 9, 5, 1, 10]
        [7, 3, 9, 10, 5, 1]

tests:
-   category: public
    input: |
        0 1 2 3 4 5 6 7 8
        4
    output: |
        [4, 0, 1, 2, 3, 5, 6, 7, 8]
        [4, 5, 0, 1, 2, 3, 6, 7, 8]
        [4, 5, 6, 0, 1, 2, 3, 7, 8]
        [4, 5, 6, 7, 0, 1, 2, 3, 8]
        [4, 5, 6, 7, 8, 0, 1, 2, 3]
-   category: public
    input: |
        5 1 7 3 9 10
        2
    output: |
        [7, 5, 1, 3, 9, 10]
        [7, 3, 5, 1, 9, 10]
        [7, 3, 9, 5, 1, 10]
        [7, 3, 9, 10, 5, 1]
-   input: |
        0 1 2
        2
    output: |
        [2, 0, 1]
-   input: |
        9 1 6 2 6
        3
    output: |
        [2, 9, 1, 6, 6]
        [2, 6, 9, 1, 6]
