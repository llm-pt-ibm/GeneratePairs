        push 18
        push 20
        print
        pop
        pop
        pop
        pop
        end
    output: |
        empty
        2
        5
        2 5
        2
        full
        2 11 18
        empty
-   category: public
    input: |
        5
        push 1
        push 2
        push 3
        print
        end
    output: |
        1 2 3
-   input: |
        3
        push 1
        push 2
        push 3
        pop
        print
        push 4
        push 5
        end
    output: |
        1 2
        full
-   input: |
        5
        push 1
        push 2
        push 3
        push 4
        push 5
        push 6
        push 7
        push 8
        pop
        peek
        push 6
        print
        end
    output: |
        full
        full
        full
        4
        1 2 3 4 6
-   input: |
        2
        push 1
        print
        print
        end
    output: |
        1
