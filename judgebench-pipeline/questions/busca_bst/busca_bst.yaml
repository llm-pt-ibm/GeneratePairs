name: busca_bst
label: Busca BST
tags: [arvores binarias, bst, busca binaria]
text: |

    # Busca em Árvores Binárias de Pesquisa

    Escreva um programa que leia os números a serem adicionados em uma BST e
    um número a ser procurado nessa árvore. Seu programa deve imprimir
    o caminho realizado até encontrar o elemento. 

    ## Entrada

    Seu programa deve ler duas linhas da entrada. 
    A primeira linha irá conter (em ordem) os elementos que devem ser adicionados à árvore.
    A segunda irá conter o elemento a ser procurado.

    Você pode assumir que não haverá elementos repetidos na árvore.

    ## Saída

    Seu programa deve imprimir o caminho realizado até encontrar o elemento. Caso não
    encontre, deve imprimir o caminho até a última folha visitada.

    ## Exemplos de execução
    
        $ javac Solution.java; java Solution
        10 8 1 9 20 18 25
        1
        [10, 8, 1]

        $ javac Solution.java; java Solution
        10 8 1 9 20 18 25
        16
        [10, 20, 18]




tests:

-   input: |
        10 8 1 9 20 18 25
        1
    output: |
        [10, 8, 1]
    category: public

-   input: |
        10 8 1 9 20 18 25
        16
    output: |
        [10, 20, 18]
    category: public

-   input: |
        1 2 3 4 5 6 7 8
        1
    output: |
        [1]

-   input: |
        1 2 3 4 5 6 7 8
        3
    output: |
        [1, 2, 3]

-   input: |
        10 9 8 7
        6
    output: |
        [10, 9, 8, 7]

-   input: |
        100 80 200 90 150 300 85 170 400 350 320 330
        330
    output: |
        [100, 200, 300, 400, 350, 320, 330]

-   input: |
        100 80 200 90 150 300 85 170 400 350 320 330
        90
    output: |
        [100, 80, 90]

-   input: |
        100 80 200 90 150 300 85 170 400 350 320 330
        83
    output: |
        [100, 80, 90, 85]
