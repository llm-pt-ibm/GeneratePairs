name: soma_folhas
label: Soma folhas
tags: [arvores binarias, bst]
text: |

    # Soma folhas em Árvores Binárias de Pesquisa

    Implemente um programa que some os valores de todas as folhas de uma árvore binária de pesquisa.

    ## Entrada

    Seu programa deve ler apenas uma linha da entrada. 
    Essa linha irá conter (em ordem) os elementos que devem ser adicionados à árvore.

    Você pode assumir que não haverá elementos repetidos na árvore.

    ## Saída

    Seu programa deve imprimir a soma dos valores de todas as folhas da árvore.


    ## Exemplo de execução
    
        $ javac Solution.java; java Solution
        10 8 1 9 20 18 25
        53


tests:
-   category: public
    input: |
        10 8 1 9 20 18 25
    output: |
        53

-   input: |
        10 8
    output: |
        8

-   input: |
        10 8 9
    output: |
        9

-   input: |
        10 8 9 12
    output: |
        21

-   input: |
        10 8 9 12 11
    output: |
        20

-   input: |
        10 8 9 12 11 13
    output: |
        33
