name: insertion_sort_recursivo
label: InsertionSort Recursivo
tags: [ordenacao, recursividade]
text: |
    
    # Insertion Sort recursivo
    
    Escreva um programa que ordena um array de inteiros utilizando o insertion sort. 
    No entanto, dessa vez, sua implementação deve ser recursiva. 

    Seu programa deve imprimir o status do array a inserção ordenada (exceto a primeira).
    
    ## Entrada
    
    Seu programa irá ler apenas um linha de entrada, que consiste em uma lista de inteiros separados por espaço.
    
    ## Saída
    
    Na saída, imprima o array a cada inserção ordenada. Seu programa
    deve parar assim que imprimir a sequência ordenada.

    ## Restrições

    Seu programa deve, obrigatoriamente, utilizar recursão.    

    ## Dica

    Imprima o array com `Arrays.toString(array)`.
    
    ## Exemplos de execução
    
        javac Solucao.java; java Solucao
        5 0 6 2
        [0, 5, 6, 2]
        [0, 5, 6, 2]
        [0, 2, 5, 6]
    
        javac Solucao.java; java Solucao
        4 3 2 1
        [3, 4, 2, 1]
        [2, 3, 4, 1]
        [1, 2, 3, 4]
tests: 
-   category: public
    input: |
        5 0 6 2
    output: |
        [0, 5, 6, 2]
        [0, 5, 6, 2]
        [0, 2, 5, 6]
-   category: public
    input: |
        4 3 2 1
    output: |
        [3, 4, 2, 1]
        [2, 3, 4, 1]
        [1, 2, 3, 4]
-   input: |
        1 22 5 34 0 12
    output: |
        [1, 22, 5, 34, 0, 12]
        [1, 5, 22, 34, 0, 12]
        [1, 5, 22, 34, 0, 12]
        [0, 1, 5, 22, 34, 12]
        [0, 1, 5, 12, 22, 34]
-   input: |
        2 3 4 7 9 12
    output: |
        [2, 3, 4, 7, 9, 12]
        [2, 3, 4, 7, 9, 12]
        [2, 3, 4, 7, 9, 12]
        [2, 3, 4, 7, 9, 12]
        [2, 3, 4, 7, 9, 12]
-   input: |
        36 2 6 3 2 15 0
    output: |
        [2, 36, 6, 3, 2, 15, 0]
        [2, 6, 36, 3, 2, 15, 0]
        [2, 3, 6, 36, 2, 15, 0]
        [2, 2, 3, 6, 36, 15, 0]
        [2, 2, 3, 6, 15, 36, 0]
        [0, 2, 2, 3, 6, 15, 36]
