name: conta_folhas
label: Conta Folhas BST
tags: [arvores binarias, bst]
text: |

    # Conta folhas em Árvores Binárias de Pesquisa

    Implemente um programa que conte quantos nós folhas 
    há em uma árvore binária de pesquisa.


    ## Entrada

    Seu programa deve ler apenas uma linha da entrada. 
    Essa linha irá conter (em ordem) os elementos que devem ser adicionados à árvore.

    Você pode assumir que não haverá elementos repetidos na árvore.

    ## Saída

    Seu programa deve imprimir a quantidade de nós folhas na árvore.

    ## Exemplo de execução
    
        $ javac Solution.java; java Solution
        10 8 1 9 20 18 25
        4


tests:
-   category: public
    input: |
        10 8 1 9 20 18 25
    output: |
        4

-   input: |
        10
    output: |
        1

-   input: |
        10 8 9
    output: |
        1

-   input: |
        10 8 9 1 12
    output: |
        3

-   input: |
        10 8
    output: |
        1

-   input: |
        10
    output: |
        1
