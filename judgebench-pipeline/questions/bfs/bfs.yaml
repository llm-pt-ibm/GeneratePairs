    # Encaminhamento em Largura (BFS)

    Há diversas formas de se percorrer uma árvore binária de pesquisa. 
    Breadth-first search (BFS) ou Encaminhamento em Largura é uma forma de visitar
    um grafo em largura. Para árvores binárias de pesquisa isso significa que os nós
    serão visitados por níveis.

    Escreva um programa que leia os números a serem adicionados em uma BST e
    imprima o resultado do encaminhamento por largura nessa árvore.


    ## Entrada

    Seu programa deve ler apenas uma linha da entrada. 
    Essa linha irá conter (em ordem) os elementos que devem ser adicionados à árvore.

    Você pode assumir que não haverá elementos repetidos na árvore.

    ## Saída

    Seu programa deve imprimir o resultado do encaminhamento em largura na árvore lida.

    ## Exemplo de execução
    
        $ javac Solution.java; java Solution
        10 8 1 9 20 18 25
        10 8 20 1 9 18 25

tests:
-   input: |
        9
    output: |
        9

-   input: |
        1 2 3 4 5 6 7 8
    output: |
        1 2 3 4 5 6 7 8

-   category: public
    input: |
        10 8 1 9 20 18 25
    output: |
        10 8 20 1 9 18 25

-   input: |
        10 9 8 7
    output: |
        10 9 8 7

-   input: |
        10 110 90 9 8 7
    output: |
        10 9 110 8 90 7

-   input: |
        10 110 90 9 8 7 3 6 91
    output: |
        10 9 110 8 90 7 91 3 6

