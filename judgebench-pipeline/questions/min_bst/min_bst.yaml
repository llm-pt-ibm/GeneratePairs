name: min_bst
label: Min BST
tags: [arvores binarias, bst]
text: |

    # Mínimo em uma árvore binária de pesquisa

    Implemente um programa que identifique o valor mínimo em uma BST.

    ## Entrada

    Seu programa deve ler apenas uma linha da entrada. 
    Essa linha irá conter (em ordem) os elementos que devem ser adicionados à árvore.

    Você pode assumir que não haverá elementos repetidos na árvore e que a árvore possui
    ao menos um elemento.

    ## Saída

    Seu programa deve imprimir o caminho percorrido até o elemento mínimo 
    da árvore.

    ## Exemplo de execução
    
        $ javac Solution.java; java Solution
        10 8 1 9 20 18 25
        10 8 1


tests:
-   category: public
    input: |
        10 8 1 9 20 18 25
    output: |
        10 8 1

-   input: |
        10
    output: |
        10

-   input: |
        10 8 9
    output: |
        10 8

-   input: |
        10 8 9 1 12
    output: |
        10 8 1

-   input: |
        10 12
    output: |
        10
