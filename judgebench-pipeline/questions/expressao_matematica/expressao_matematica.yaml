text: |

    # Expressão Matemática

    Escreva um programa leia uma expressão matemática com inteiros 
    positivos e imprime o valor resultante dessa expressão.

    ## Entrada
    
    Seu programa irá ler apenas uma linha da entrada padrão. Essa linha consiste em uma string com uma expressão
    matemática bem formada.

    ## Saída
    
    Seu programa deve imprimir o resultado da avaliação da expressão matemática.

    ## Exemplo de execução

        $ javac Solucao.java; java Solucao
        (1+((2+3)*(4*5)))
        101
        $


        javac Solucao.java; java Solucao
        ((7+4)*(3-4))-(2*3)
        -17

    ## Dica

    Uma Pilha pode te auxiliar no desmembramento da expressão.

tests:
-   category: public
    input: |
        (1+((2+3)*(4*5)))
    output: |
        101

-   category: public
    input: |
        ((7+4)*(3-4))-(2*3)
    output: |
        -17
-   input: |
        (1+1)
    output: |
        2
-   input: |
        (7+(3*(1*2)+1)+1)
    output: |
        15
