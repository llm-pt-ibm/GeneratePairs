name: max_bst 
label: Max BST
tags: [arvores binarias, bst]
text: |

    # Máximo em uma árvore binária de pesquisa

    Implemente um programa que identifique o valor máximo em uma BST.

    ## Entrada

    Seu programa deve ler apenas uma linha da entrada. 
    Essa linha irá conter (em ordem) os elementos que devem ser adicionados à árvore.

    Você pode assumir que não haverá elementos repetidos na árvore e que 
    a árvore possui ao menos um elemento.

    ## Saída

    Seu programa deve imprimir o caminho percorrido até o elemento máximo 
    da árvore.

    ## Exemplo de execução
    
        $ javac Solution.java; java Solution
        10 8 1 9 20 18 25
        10 20 25


tests:
-   category: public
    input: |
        10 8 1 9 20 18 25
    output: |
        10 20 25

-   input: |
        10
    output: |
        10

-   input: |
        10 8 9
    output: |
        10

-   input: |
        10 8 9 1 12
    output: |
        10 12

-   input: |
        10 12 15 16 18
    output: |
        10 12 15 16 18

-   input: |
        10 12 15 11
    output: |
        10 12 15
