name: quantidade_elementos_menores_bst
label: Elementos menores BST
tags: [arvores binarias, bst]
text: |

    # Quantos elementos menores?

    Escreva um programa que leia os números a serem adicionados em uma BST e um número N e
    determine a quantidade de elementos menores que N na árvore.

    ## Entrada

    Seu programa deve ler duas linhas da entrada padrão. 
    A primeira contendo (em ordem) os elementos que devem ser adicionados
    na árvore. A segunda linha contêm um inteiro N.


    Você pode assumir que não haverá elementos repetidos na árvore.
    Você **não** deve assumir que N está presente na árvore.

    ## Saída

    Seu programa deve imprimir em pré-ordem a árvore lida e deve imprimir quantos
    elementos menores que N estã presentes na árvore.

    ## Exemplos de execução

        $ javac Solution.java; java Solution
        10 8 1 9 20 18 25
        10
        [10, 8, 1, 9, 20, 18, 25]
        3

tests:

-   input: |
        10 8 1 9 20 18 25
        10
    output: |
        [10, 8, 1, 9, 20, 18, 25]
        3
    category: public

